<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TALLUDON0 AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111318;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 65px;
    background: #191c24;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
}

header h2 {
    font-size: 19px;
}

button {
    background: #3478ed;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
}

#chat {
    height: calc(100dvh - 140px);
    overflow-y: auto;
    padding: 15px;
}

.message {
    padding: 14px;
    margin: 12px 0;
    border-radius: 15px;
    max-width: 88%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #2858a5;
    margin-left: auto;
}

.bot {
    background: #252a34;
}

#bottom {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #191c24;
}

#msg {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 12px;
    background: #282d38;
    color: white;
    border: 1px solid #414653;
    font-size: 16px;
}

</style>
</head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#090909">
<body>

<header>
    <h2>⚡ TALLUDON0 AI</h2>
    <button onclick="newChat()">New Chat</button>
</header>

<div id="chat">

    <div class="message bot">
        Hello! Welcome to TALLUDON0 AI.

        What would you like to talk about?
    </div>

</div>

<div id="bottom">

    <input id="msg"
    placeholder="Message Talludon0 AI..."
    autocomplete="off">

    <button id="send" onclick="sendMessage()">Send</button>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("msg");

let history = [];

function addMessage(text, type) {

    let div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
}

async function sendMessage() {

    let message = input.value.trim();

    if (!message) return;

    input.value = "";

    addMessage(message, "user");

    history.push({
        role: "user",
        parts: [{text: message}]
    });

    let loading = addMessage(
        "Talludon0 AI is thinking...",
        "bot"
    );

    document.getElementById("send").disabled = true;

    try {

        let response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                contents: history.slice(-20)
            })

        });

        let data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "AI request failed");
        }

        history.push({
            role: "model",
            parts: [{text: data.reply}]
        });

        loading.textContent = data.reply;

    } catch(error) {

        history.pop();

        loading.textContent =
            "Error: " + error.message;

    }

    document.getElementById("send").disabled = false;

    chat.scrollTop = chat.scrollHeight;
}

function newChat() {

    history = [];

    chat.innerHTML = "";

    addMessage(
        "New conversation started! How can I help?",
        "bot"
    );

}

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
}
</script>
</body>
</html>
